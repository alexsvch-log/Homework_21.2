[project]
name = "homework-21-2"
version = "0.1.0"
description = ""
authors = [
    {name = "alex_svch_777",email = "logger_77@mail.ru"}
]
requires-python = "^3.14"
dependencies = [
    "flask (>=3.1.3,<4.0.0)"
]

[tool.poetry]
packages = [{include = "homework_21"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "flake8-pyproject (>=1.2.4,<2.0.0)"
]


[tool.flake8]
# Игнорировать ошибки (совместимость с Black)
extend-ignore = ["E203", "W503", "D203"]
# Максимальная длина строки
max-line-length = 119
# Исключить директории
exclude = [".git", "__pycache__", "venv", ".venv", "logs", "htmlcov", ".env", ".env.example"]
# Игнорировать правила для конкретных файлов
per-file-ignores = [
    "example.py:F401",
]

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 119

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ['venv', 'example.py']  # Исключение папок

[[tool.mypy.overrides]]
module = "flask.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "werkzeug.*"
ignore_missing_imports = true